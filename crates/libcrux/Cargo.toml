[package]
name = "cosmian_libcrux_provider"
version = "1.0.0"
description = "Verified, pure-Rust provider."

authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
crate-type = ["lib", "staticlib"]
name = "cosmian_libcrux_provider"
path = "src/lib.rs"

[dependencies]
cosmian_crypto_core = { path = "../core", version = "11", default-features = false }
libcrux-ml-kem = { version = "0.0.6" }
zeroize = { workspace = true }

[dev-dependencies]
cosmian_crypto_core = { path = "../core", version = "11", default-features = false, features = ["sha3"] }
